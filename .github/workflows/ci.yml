name: Starter CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-and-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify required policy files exist
        run: |
          test -f AGENTS.md
          test -f SOUL.md
          test -f governance/INTEGRATION_ACCEPTANCE_POLICY.md
